<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background-color: #040408;
        background-image:
          radial-gradient(ellipse at 8% 20%,  rgba(0, 220, 200, 0.22) 0%, transparent 50%),
          radial-gradient(ellipse at 90% 5%,  rgba(140, 40, 255, 0.28) 0%, transparent 50%),
          radial-gradient(ellipse at 60% 95%, rgba(20, 80, 220, 0.18) 0%, transparent 45%);
        font-family: 'Space Grotesk', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        width: 1080px;
        height: 510px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 24px;
        backdrop-filter: blur(20px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 72px;
        position: relative;
        overflow: hidden;
      }

      /* inner glow top-left */
      .card::before {
        content: '';
        position: absolute;
        top: -60px; left: -60px;
        width: 320px; height: 320px;
        background: radial-gradient(circle, rgba(0,220,200,0.12) 0%, transparent 70%);
        pointer-events: none;
      }

      /* inner glow bottom-right */
      .card::after {
        content: '';
        position: absolute;
        bottom: -80px; right: -40px;
        width: 360px; height: 360px;
        background: radial-gradient(circle, rgba(133,196,103,0.08) 0%, transparent 70%);
        pointer-events: none;
      }

      .left {
        display: flex;
        flex-direction: column;
        gap: 20px;
        z-index: 1;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(133, 196, 103, 0.1);
        border: 1px solid rgba(133, 196, 103, 0.3);
        border-radius: 100px;
        padding: 6px 16px;
        width: fit-content;
      }

      .tag-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #85c467;
      }

      .tag-text {
        font-size: 14px;
        font-weight: 500;
        color: #85c467;
        letter-spacing: 0.5px;
      }

      .name {
        font-size: 64px;
        font-weight: 700;
        color: #ffffff;
        line-height: 1.05;
        letter-spacing: -1.5px;
      }

      .role {
        font-size: 22px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.45);
        letter-spacing: -0.2px;
      }

      .role span {
        color: rgba(255, 255, 255, 0.75);
        font-weight: 500;
      }

      .pills {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 4px;
      }

      .pill {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 5px 14px;
        font-size: 13px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.5);
        letter-spacing: 0.2px;
      }

      .right {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        z-index: 1;
      }

      .avatar {
        width: 220px;
        height: 220px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 0 1px rgba(0,220,200,0.08), 0 12px 40px rgba(0,0,0,0.6);
        object-fit: cover;
      }

      .url {
        font-size: 14px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.25);
        letter-spacing: 0.3px;
      }

      .divider {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 52px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="left">
        <div class="tag">
          <div class="tag-dot"></div>
          <span class="tag-text">Full-Stack Developer · Tech Lead</span>
        </div>
        <div class="name">Bartalis<br/>Krisztián</div>
        <div class="role">Based in <span>Székelyudvarhely, Romania</span></div>
        <div class="pills">
          <div class="pill">React</div>
          <div class="pill">TypeScript</div>
          <div class="pill">Node.js</div>
          <div class="pill">AWS</div>
          <div class="pill">NestJS</div>
        </div>
      </div>

      <div class="right">
        <img class="avatar" src="og-avatar.png" alt="Bartalis Krisztián"/>
        <div class="url">bartaliskrisztian.github.io</div>
      </div>

      <div class="divider"></div>
    </div>
  </body>
</html>
